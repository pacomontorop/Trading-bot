name: CI
on:
  push:
    paths: ["scripts/**", "config/risk_limits.json", ".github/workflows/**", "tests/test_hardening.py"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pytest
      - name: Compilar scripts
        run: python -m py_compile scripts/*.py
      - name: Validar risk_limits.json
        run: python -c "import json;json.load(open('config/risk_limits.json'))"
      - name: Tests de endurecimiento
        run: python -m pytest -q tests/test_hardening.py
