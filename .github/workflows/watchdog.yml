name: Watchdog
on:
  schedule:
    - cron: "20 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (no envía órdenes ni escribe log)"
        type: boolean
        default: false
concurrency:
  group: watchdog
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias
        run: pip install -q yfinance requests
      - name: Run
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          APCA_KEY:   ${{ secrets.APCA_KEY }}
          APCA_SEC:   ${{ secrets.APCA_SEC }}
          APCA_KEY_R: ${{ secrets.APCA_KEY_R }}
          APCA_SEC_R: ${{ secrets.APCA_SEC_R }}
          GH_TOKEN:   ${{ secrets.GH_TOKEN_TRADING || github.token }}
          TG_TOKEN:   ${{ secrets.TG_TOKEN }}
          TG_CHAT:    ${{ secrets.TG_CHAT }}
          UW_KEY:     ${{ secrets.UW_KEY }}
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: python scripts/watchdog.py
