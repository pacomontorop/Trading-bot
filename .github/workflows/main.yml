name: Market Open Execution
on:
  schedule:
    - cron: "40 13 * * 1-5"
  workflow_dispatch:
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        env:
          APCA_KEY:   ${{ secrets.APCA_KEY }}
          APCA_SEC:   ${{ secrets.APCA_SEC }}
          APCA_KEY_R: ${{ secrets.APCA_KEY_R }}
          APCA_SEC_R: ${{ secrets.APCA_SEC_R }}
          GH_TOKEN:   ${{ secrets.GH_TOKEN_TRADING }}
          TG_TOKEN:   ${{ secrets.TG_TOKEN }}
          TG_CHAT:    ${{ secrets.TG_CHAT }}
        run: python scripts/market_open_execution.py
